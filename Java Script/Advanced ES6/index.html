<script>

// =====================================
// AUFGABE 1 – Destructuring + Logik
// =====================================

// Gegeben ist:

const students = [
  { name: "Max", points: 80 },
  { name: "Anna", points: 45 },
  { name: "John", points: 60 }
];

students.forEach(({ name, points }) => {
  const status = points >= 50 ? "bestanden" : "nicht bestanden";
  console.log(`${name} → ${status}`);
})


// Aufgabe:
// Verwende forEach und Destructuring
// Für jeden Studenten:
// - wenn points >= 50 → "bestanden"
// - sonst → "nicht bestanden"

// Erwartete Ausgabe:
// Max → bestanden
// Anna → nicht bestanden
// John → bestanden


// =====================================
// AUFGABE 2 – Rest + Filter
// =====================================

// Erstelle eine Funktion:

// filterNumbers(limit, ...numbers)

// Aufgabe:
// - Verwende den Rest-Operator (...numbers)
// - Gib nur Zahlen zurück, die größer als "limit" sind
// - Verwende filter()

// Beispiel:
// filterNumbers(10, 5, 20, 30, 8)
// → [20, 30]

function filterNumbers(limit, ...numbers) {
  return numbers.filter(n => n > limit);
}

// Beispiel:
console.log(filterNumbers(10, 5, 20, 30, 8)); 
// → [20, 30]

</script>
