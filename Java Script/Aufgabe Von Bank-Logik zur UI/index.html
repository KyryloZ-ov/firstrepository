    <script>
    
    const bankAccount = {
        owner: "Max",
        balance: 100,

        deposit: function(amount) {
            this.balance += amount;
        },

        withdraw: function(amount) {
            if (amount <= this.balance) {
                this.balance -= amount;
            } else {
                alert("Nicht genug Geld");
            }
        }
    };

</script>
