<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Übung 4</title>
</head>
<body>

    <script>

        const game = {
            score: 0,

            addPoints: function(points) {
                this.score += points;
                this.save();
            },

            save: function() {
                localStorage.setItem("score", this.score);
            },

            load: function() {
                const saved = localStorage.getItem("score");
                if (saved !== null) {
                    this.score = Number(saved);
                }
             }
        };

        game.load();

    </script>
    
</body>
</html>
