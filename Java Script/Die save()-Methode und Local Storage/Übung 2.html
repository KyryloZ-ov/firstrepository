<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Übung 2</title>
</head>
<body>

    <script>

        const game = {
            score: 0,

            addPoints: function(points) {
                this.score += points;
                this.save();
            },

            save: function() {
                localStorage.setItem("score", this.score);
            }
        };

        game.addPoints(5);

    </script>
    
</body>
</html>
